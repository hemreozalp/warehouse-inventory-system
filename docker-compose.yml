services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-inventory-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/warehouse_inventory
      DB_USERNAME: warehouse_user
      DB_PASSWORD: warehouse_password
      JWT_SECRET: change-this-secret-before-production-use
      JWT_EXPIRATION_MINUTES: 60
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: warehouse-inventory-postgres
    environment:
      POSTGRES_DB: warehouse_inventory
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
